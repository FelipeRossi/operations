function weekNum(s){const m=String(s==null?'':s).match(/\d+/);return m?parseInt(m[0],10):null;}
function stockDeSemana(wi){
  const wLabel=(WK[wi]||'').trim().toLowerCase();
  const exact=STOCK.filter(s=>(s.semana||'').trim().toLowerCase()===wLabel);
  if(exact.length) return exact;
  const t=weekNum(WK[wi]); if(t==null) return [];
  return STOCK.filter(s=>weekNum(s.semana)===t);
}
function ciclosDeSemana(wi){
  const wLabel=(WK[wi]||'').trim().toLowerCase();
  const exact=CICLOS.filter(c=>(c.semana||'').trim().toLowerCase()===wLabel);
  if(exact.length) return exact;
  const t=weekNum(WK[wi]); if(t==null) return [];
  return CICLOS.filter(c=>weekNum(c.semana)===t);
}
function ciclosTipos(){
  const seen=new Set(),list=[];
  for(const c of CICLOS){ if(c.nombre&&!seen.has(c.nombre)){seen.add(c.nombre);list.push(c.nombre);} }
  return list;
}
function ciclosSemanas(){
  const seen=new Set(),list=[];
  for(const c of CICLOS){ if(c.semana&&!seen.has(c.semana)){seen.add(c.semana);list.push(c.semana);} }
  return list;
}

function getObj(ind,wi){
  if(ind.objFijo!==null&&ind.objFijo!==undefined) return ind.objFijo;
  return ind.obj?ind.obj[wi]:null;
}
function getSt(ind,wi){
  const r=ind.real[wi],o=getObj(ind,wi);
  if(r==null||o==null) return 'na';
  return ind.logica==='mayor'?(r>=o?'g':'r'):(r<=o?'g':'r');
}
function getFF(ind,wi){
  const r=ind.real[wi],o=getObj(ind,wi);
  if(r==null||o==null) return null;
  if(ind.logica==='mayor') return o!==0?Math.round(r/o*100):100;
  if(r===0) return 100;
  return Math.round(o/r*100);
}
function fmt(v){
  if(v==null) return '<span class="na-val">N/A</span>';
  return String(Number.isInteger(v)?v:parseFloat(v.toFixed(2)));
}
function pillH(st,ff){
  if(st==='na') return '<span class="pill pn">N/A</span>';
  return`<span class="pill p${st}">${ff}%</span>`;
}
function critPill(v){
  const s=(v||'').trim().toLowerCase();
  if(s==='si'||s==='sí') return '<span class="crit-pill" style="background:rgba(248,81,73,.15);color:#f85149;border:1px solid rgba(248,81,73,.3)">Crítico</span>';
  if(s==='no') return '<span class="crit-pill" style="background:rgba(63,185,80,.1);color:#3fb950;border:1px solid rgba(63,185,80,.25)">No</span>';
  return '<span class="crit-pill" style="background:rgba(139,148,158,.1);color:#8b949e">—</span>';
}

function buildCharts(){
  Object.values(charts).forEach(c=>c.destroy());
  charts={};
  IND.forEach((ind,i)=>{
    const canvas=document.getElementById(`chart-ind-${i}`);
    if(!canvas) return;
    const areaColor=ACFG[ind.area]?ACFG[ind.area].color:'#58a6ff';
    const objSeries=WK.map((_,wi)=>getObj(ind,wi));
    const ctx=canvas.getContext('2d');
    charts[`ind${i}`]=new Chart(ctx,{
      type:'line',
      data:{labels:WK,datasets:[
        {label:'Real',data:ind.real,borderColor:areaColor,backgroundColor:'transparent',borderWidth:2.5,pointRadius:2,pointHoverRadius:5,tension:0.3,spanGaps:true},
        {label:'Objetivo',data:objSeries,borderColor:'#8b949e',backgroundColor:'transparent',borderWidth:2,borderDash:[6,4],pointRadius:0,tension:0,spanGaps:true}
      ]},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        plugins:{legend:{display:true,position:'bottom',labels:{color:'#8b949e',boxWidth:16,font:{size:12}}},
          tooltip:{backgroundColor:'#161b22',borderColor:'#30363d',borderWidth:1,titleColor:'#e6edf3',bodyColor:'#8b949e'}},
        scales:{x:{ticks:{color:'#8b949e',font:{size:9},maxRotation:90,minRotation:90},grid:{color:'#21262d'}},
                y:{ticks:{color:'#8b949e',font:{size:11}},grid:{color:'#21262d'}}}}
    });
  });
  const tipos=ciclosTipos(), semC=ciclosSemanas();
  tipos.forEach((tipo,i)=>{
    const canvas=document.getElementById(`chart-ciclo-${i}`);
    if(!canvas) return;
    const real=semC.map(w=>{const row=CICLOS.find(c=>c.semana===w&&c.nombre===tipo); return row?row.diasProm:null;});
    const obj=semC.map(w=>{const row=CICLOS.find(c=>c.semana===w&&c.nombre===tipo); return row?row.diasObj:null;});
    const ctx=canvas.getContext('2d');
    charts[`ciclo${i}`]=new Chart(ctx,{
      type:'line',
      data:{labels:semC,datasets:[
        {label:'Días promedio',data:real,borderColor:'#39c5cf',backgroundColor:'transparent',borderWidth:2.5,pointRadius:4,pointHoverRadius:6,tension:0.3,spanGaps:true},
        {label:'Días objetivo',data:obj,borderColor:'#8b949e',backgroundColor:'transparent',borderWidth:2,borderDash:[6,4],pointRadius:0,tension:0,spanGaps:true}
      ]},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        plugins:{legend:{display:true,position:'bottom',labels:{color:'#8b949e',boxWidth:16,font:{size:12}}},
          tooltip:{backgroundColor:'#161b22',borderColor:'#30363d',borderWidth:1,titleColor:'#e6edf3',bodyColor:'#8b949e'}},
        scales:{x:{ticks:{color:'#8b949e',font:{size:11}},grid:{color:'#21262d'}},
                y:{ticks:{color:'#8b949e',font:{size:11}},grid:{color:'#21262d'}}}}
    });
  });
}

    <table><thead><tr><th style="width:10%">Código</th><th style="width:24%">Descripción</th>
    <th class="r" style="width:9%">Stock</th><th class="r" style="width:10%">Desv.Est.</th><th class="r" style="width:9%">SS</th>
    <th class="c" style="width:10%">Quiebre</th><th style="width:28%">Comentario</th></tr></thead><tbody>`;
  if(!stockSem.length) html+=`<tr><td colspan="7" style="text-align:center;color:#8b949e;padding:30px">Sin registro de stock para esta semana</td></tr>`;
  for(const s of stockSem){
    const qb=s.q>0?`<span class="pill pr">${s.q}</span>`:`<span class="pill pg">0</span>`;
    html+=`<tr><td><span class="cod">${s.cod}</span></td><td>${s.desc}</td>
      <td class="r" style="color:#8b949e">${s.stock!=null&&!isNaN(s.stock)?s.stock.toFixed(2):'—'}</td>
      <td class="r" style="color:#8b949e">${s.ds!=null&&!isNaN(s.ds)?s.ds.toFixed(2):'—'}</td>
      <td class="r" style="color:#8b949e">${s.ss!=null&&!isNaN(s.ss)?s.ss.toFixed(2):'—'}</td>
      <td class="c">${qb}</td><td style="font-size:16px;color:#8b949e">${s.com}</td></tr>`;
  }
  html+=`</tbody></table></div>`;

  html+=`<div class="area-block area-ciclos">
    <div class="area-head"><i class="ti ti-truck-delivery area-icon" style="color:#39c5cf"></i>
    <span class="area-title">Ciclos de compra</span>
    <span style="font-size:16px;color:#8b949e;font-weight:600;margin-left:10px">— ${WK[wi]}</span>
    <div class="area-counts"><span class="cnt cnt-r">${ciclosAtr} con atraso</span></div></div>
    <table><thead><tr><th style="width:34%">Tipo de ciclo</th><th class="r" style="width:12%">Días obj.</th>
    <th class="r" style="width:12%">Días prom.</th><th class="c" style="width:14%">Cumplimiento</th>
    <th class="r" style="width:14%">Abiertos</th><th class="c" style="width:14%">Con atraso</th></tr></thead><tbody>`;
  if(!ciclosSem.length) html+=`<tr><td colspan="6" style="text-align:center;color:#8b949e;padding:30px">Sin registro para esta semana</td></tr>`;
  for(const c of ciclosSem){
    const ok=c.cumplPct!=null&&c.cumplPct>=100;
    const cumplPill=c.cumplPct!=null?`<span class="pill ${ok?'pg':'pr'}">${c.cumplPct}%</span>`:'<span class="pill pn">N/A</span>';
    const atrPill=c.atrasados!=null?(c.atrasados>0?`<span class="pill pr">${c.atrasados}</span>`:`<span class="pill pg">0</span>`):'<span class="pill pn">—</span>';
    html+=`<tr><td>${c.nombre}</td><td class="r">${c.diasObj??'—'}</td><td class="r">${c.diasProm??'—'}</td>
      <td class="c">${cumplPill}</td><td class="r">${c.abiertos??'—'}</td><td class="c">${atrPill}</td></tr>`;
  }
  html+=`</tbody></table>`;

  html+=`<div class="tab-row">
    <button class="tab-btn ${activeDetail==='SOLPED'?'tab-active':''}" onclick="setDetail('SOLPED')">Solicitudes de compra (${SOLPED.length})</button>
    <button class="tab-btn ${activeDetail==='PEDNAC'?'tab-active':''}" onclick="setDetail('PEDNAC')">Pedidos nacionales (${PEDNAC.length})</button>
    <button class="tab-btn ${activeDetail==='PEDEX'?'tab-active':''}" onclick="setDetail('PEDEX')">Pedidos extranjeros (${PEDEX.length})</button>
  </div><div class="tab-wrap">`;
  if(activeDetail==='SOLPED'){
    html+=`<table><thead><tr><th style="width:10%">N° Solped</th><th style="width:34%">Descripción</th>
      <th style="width:16%">Propietario</th><th style="width:14%">Estado</th><th class="r" style="width:8%">Días</th><th style="width:18%">Comentario</th></tr></thead><tbody>`;
    for(const s of SOLPED) html+=`<tr><td><span class="cod">${s.id??'—'}</span></td><td>${s.desc??'—'}</td>
      <td style="color:#8b949e">${s.prop??'—'}</td><td style="color:#8b949e">${s.estado??'—'}</td>
      <td class="r" style="color:#8b949e">${s.dias??'—'}</td><td style="font-size:16px;color:#8b949e">${s.comentario??'—'}</td></tr>`;
    html+=`</tbody></table>`;
  } else if(activeDetail==='PEDNAC'){
    html+=`<table><thead><tr><th style="width:9%">N° Pedido</th><th style="width:10%">Artículo</th><th style="width:22%">Descripción</th>
      <th style="width:16%">Proveedor</th><th style="width:14%">Propietario</th><th style="width:9%">Entrega</th>
      <th style="width:9%">Crítico</th><th class="r" style="width:6%">Días</th></tr></thead><tbody>`;
    for(const p of PEDNAC) html+=`<tr><td><span class="cod">${p.pedido??'—'}</span></td><td><span class="cod">${p.articulo??'—'}</span></td>
      <td>${p.desc??'—'}</td><td style="font-size:16px;color:#8b949e">${p.proveedor??'—'}</td>
      <td style="font-size:16px;color:#8b949e">${p.prop??'—'}</td><td style="font-size:16px;color:#8b949e">${p.entrega??'—'}</td>
      <td>${critPill(p.critico)}</td><td class="r" style="color:#8b949e">${p.dias??'—'}</td></tr>`;
    html+=`</tbody></table>`;
  } else if(activeDetail==='PEDEX'){
    html+=`<table><thead><tr><th style="width:11%">Artículo</th><th style="width:28%">Descripción</th>
      <th style="width:18%">Proveedor</th><th style="width:16%">Propietario</th><th style="width:10%">Entrega</th>
      <th style="width:10%">Crítico</th><th class="r" style="width:7%">Días</th></tr></thead><tbody>`;
    for(const p of PEDEX) html+=`<tr><td><span class="cod">${p.articulo??'—'}</span></td><td>${p.desc??'—'}</td>
      <td style="font-size:16px;color:#8b949e">${p.proveedor??'—'}</td><td style="font-size:16px;color:#8b949e">${p.prop??'—'}</td>
      <td style="font-size:16px;color:#8b949e">${p.entrega??'—'}</td><td>${critPill(p.critico)}</td>
      <td class="r" style="color:#8b949e">${p.dias??'—'}</td></tr>`;
    html+=`</tbody></table>`;
  }
  html+=`</div></div>`;

  html+=`<div class="area-block area-chart">
    <div class="area-head"><i class="ti ti-chart-line area-icon" style="color:#bc8cff"></i>
    <span class="area-title">Tendencias por indicador</span></div>
    <div class="ind-charts-grid">`;
  IND.forEach((ind,i)=>{
    const unitLabel=ind.unidad?`<span class="ind-unit">(${ind.unidad})</span>`:'';
    html+=`<div class="ind-chart-card"><div class="ind-chart-title">${ind.label}${unitLabel}</div>
      <div style="position:relative;height:230px"><canvas id="chart-ind-${i}"></canvas></div></div>`;
  });
  ciclosTipos().forEach((tipo,i)=>{
    html+=`<div class="ind-chart-card"><div class="ind-chart-title">${tipo} <span class="ind-unit">(días)</span></div>
      <div style="position:relative;height:230px"><canvas id="chart-ciclo-${i}"></canvas></div></div>`;
  });
  html+=`</div></div>`;

  document.getElementById('body').innerHTML=html;
  setTimeout(buildCharts,50);
}

render();
</script>
</body>
</html>
